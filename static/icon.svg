<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="pulseGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.2"/>

  <!-- Computer screen frame -->
  <rect x="96" y="110" width="320" height="200" rx="18" fill="#111827" stroke="#334155" stroke-width="8"/>
  <!-- Screen bezel inner -->
  <rect x="110" y="124" width="292" height="172" rx="10" fill="#030712"/>

  <!-- Stand -->
  <path d="M216 318 L206 368 L306 368 L296 318 Z" fill="#334155"/>
  <rect x="166" y="364" width="180" height="12" rx="6" fill="#475569"/>

  <!-- Pulse waveform inside screen -->
  <path d="M 125 210 L 175 210 L 195 160 L 225 260 L 255 140 L 285 240 L 315 200 L 335 220 L 387 210" 
        fill="none" 
        stroke="url(#pulseGlow)" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Live dot -->
  <circle cx="387" cy="210" r="6" fill="#10b981"/>

  <!-- Phone miniature in bottom right corner -->
  <g transform="translate(320, 260)">
    <rect x="0" y="0" width="100" height="170" rx="18" fill="#0f172a" stroke="#38bdf8" stroke-width="5" filter="url(#glow)"/>
    <rect x="8" y="16" width="84" height="136" rx="8" fill="#020617"/>
    <circle cx="50" cy="8" r="3" fill="#64748b"/>
    <!-- Phone pulse -->
    <path d="M 18 84 L 35 84 L 45 64 L 55 104 L 65 74 L 82 84" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
