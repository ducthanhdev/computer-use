name: Build DeskPulse (Rust Agent & Flutter APK)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # 1. Compile Rust Desktop Agent
  build-agent:
    name: Build Rust Agent (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            agent/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('agent/Cargo.lock') }}

      - name: Build Rust Agent
        working-directory: ./agent
        run: cargo build --release

      - name: Upload Agent Binary
        uses: actions/upload-artifact@v4
        with:
          name: deskpulse-agent-linux
          path: agent/target/release/deskpulse-agent

  # 2. Compile Flutter Mobile APK
  build-flutter-apk:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter Dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Build Release APK
        working-directory: ./mobile
        run: flutter build apk --release

      - name: Upload Flutter APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeskPulse-Flutter-Release-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
